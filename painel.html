<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel dos noivos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ea;--card:#fbf9f3;--ink:#4a5033;--gold:#b08d57;--soft:#6b705a;--line:#d9d3bf;--olive:#4d5530;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f6f3ea;--card:#fbf9f3;--ink:#4a5033}}
:root[data-theme="dark"]{--bg:#f6f3ea;--card:#fbf9f3;--ink:#4a5033}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;text-align:center;font-size:18px}
.script{font-family:'Pinyon Script','Snell Roundhand',cursive;font-weight:400}
#cover{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#8b9072,#4d5530);transition:opacity .7s}
#cover.hide{opacity:0;pointer-events:none}
.cc{background:var(--card);width:min(86vw,340px);padding:42px 24px 34px;border-radius:6px;box-shadow:0 20px 50px #0004;position:relative}
.heart{width:64px;height:64px;border-radius:50%;background:var(--olive);color:#fff;display:grid;place-items:center;font-size:26px;margin:-74px auto 18px}
.cc .script{font-size:40px;line-height:1.1;margin:4px 0}
.gold{color:var(--gold)}
.btn{display:inline-block;background:var(--olive);color:#fff;border:0;border-radius:30px;padding:12px 34px;font:600 17px 'Cormorant Garamond',serif;letter-spacing:.06em;cursor:pointer;text-decoration:none}
.btn.o{background:none;color:var(--olive);border:1px solid var(--olive)}
main{max-width:460px;margin:0 auto;padding:44px 24px 90px}
section{padding:34px 0;border-bottom:1px solid var(--line)}
h2{font-size:15px;letter-spacing:.22em;text-transform:uppercase;margin:0 0 14px;font-weight:600}
.big{font-size:56px;line-height:1.05}
.sub{font-size:15px;color:var(--soft);letter-spacing:.14em;text-transform:uppercase}
.guest{font-size:34px;margin:8px 0 0}
.cd{display:flex;justify-content:center;gap:14px;margin-top:10px}
.cd div{min-width:62px}.cd b{display:block;font-size:34px;font-weight:600}.cd span{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.map{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:26px 16px;margin:16px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
#music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:10;width:48px;height:48px;border-radius:50%;border:0;background:var(--olive);color:#fff;font-size:20px;cursor:pointer}
#yt{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;border:0;left:0;top:0}
.mural{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mural img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 18%;border-radius:6px;display:block}select{font:600 17px 'Cormorant Garamond',serif;padding:10px;border:1px solid var(--olive);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
ul{list-style:none;padding:0;margin:14px 0 0;text-align:left}li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}li.m{color:var(--olive);font-weight:600}
.msg{margin-top:14px;color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:16px;text-align:left}td,th{padding:7px 4px;border-bottom:1px solid var(--line)}
.tag{font-size:13px;letter-spacing:.08em;text-transform:uppercase}.y{color:#3d7a3d}.n{color:#a14b3c}.p{color:var(--soft)}
.sm{font:600 13px 'Cormorant Garamond',serif;padding:4px 12px;border-radius:20px;border:1px solid var(--olive);background:none;color:var(--olive);cursor:pointer}
[hidden]{display:none!important}
</style></head><body>
<main style="max-width:860px"><h2>Painel dos noivos</h2>
<div id="lock"><p>Digite a senha:</p><input id="pw" type="password" style="font:18px serif;padding:8px"> <button class="btn" id="go">Entrar</button></div>
<div id="app" hidden><p id="sum"></p><p id="gs" class="msg"></p><table id="tb"></table><p class="msg" style="font-size:15px">Use “Confirmar” ou “Não vai” para marcar por um convidado que avisou fora do site. O número ao lado do nome é a quantidade de pessoas do convite (pode ser alterado). Atualiza sozinho a cada 15 segundos.</p></div></main>
<script src="config.js"></script><script src="dados.js"></script><script src="painel.js"></script></body></html>
